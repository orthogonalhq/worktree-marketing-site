<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="936" viewBox="0 0 1664 936" role="img" aria-labelledby="title desc">
  <title id="title">Digital workers scaled from approximately 220 to approximately 3,000</title>
  <desc id="desc">A sparse connected network on the left grows into a much denser connected network on the right.</desc>
  <defs>
    <pattern id="sparse-network" width="116" height="106" patternUnits="userSpaceOnUse">
      <path d="M0 53H116M58 0V106" stroke="#3b3b3d" stroke-width="2"/>
      <rect x="42" y="37" width="32" height="32" rx="1" fill="#1473f3"/>
    </pattern>
    <pattern id="dense-network" width="62" height="58" patternUnits="userSpaceOnUse">
      <path d="M0 29H62M31 0V58" stroke="#454547" stroke-width="1.5"/>
      <rect x="20" y="18" width="22" height="22" rx="1" fill="#1473f3"/>
    </pattern>
  </defs>
  <rect width="1664" height="936" fill="#050505"/>
  <text x="832" y="101" fill="#f1f1ef" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-1.5" text-anchor="middle">DIGITAL WORKERS AT SCALE</text>

  <g aria-label="Approximately 220 digital workers">
    <rect x="180" y="238" width="464" height="318" fill="url(#sparse-network)"/>
    <rect x="180" y="238" width="464" height="318" fill="none" stroke="#29292b" stroke-width="1"/>
    <text x="412" y="691" fill="#f1f1ef" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" text-anchor="middle">≈220</text>
    <text x="412" y="735" fill="#8b8b8f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3" text-anchor="middle">INITIAL WORKERS</text>
  </g>

  <g aria-label="Scale increase">
    <path d="M700 397H834" stroke="#3b3b3d" stroke-width="2"/>
    <rect x="739" y="369" width="56" height="56" rx="28" fill="#101010" stroke="#56565a" stroke-width="1.5"/>
    <path d="M758 397H776M769 390L776 397L769 404" fill="none" stroke="#1473f3" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <g aria-label="Approximately 3,000 digital workers">
    <rect x="890" y="209" width="558" height="377" fill="url(#dense-network)"/>
    <rect x="890" y="209" width="558" height="377" fill="none" stroke="#29292b" stroke-width="1"/>
    <text x="1169" y="691" fill="#f1f1ef" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="-1.5" text-anchor="middle">≈3,000</text>
    <text x="1169" y="735" fill="#8b8b8f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3" text-anchor="middle">SCALED WORKERS</text>
  </g>

  <text x="832" y="855" fill="#f1f1ef" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="4" text-anchor="middle">CONNECTED INTO RE-ENGINEERED WORKFLOWS</text>
</svg>
